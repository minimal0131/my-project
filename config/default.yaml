# USD/JPY スイング戦略 検証設定
# 日時はすべて MT5 サーバー時刻（ブローカー時刻）で記述する。

symbol: USDJPY
pip_size: 0.01            # 1 pip = 0.01 JPY
point_size: 0.001         # MT5 の spread 列の単位（3 桁表示ブローカー）

mt5:
  terminal_path: null     # null なら既定の MT5 を使用。例: "C:/Program Files/MetaTrader 5/terminal64.exe"
  # 口座情報は設定ファイルに書かない。必要なら環境変数 MT5_LOGIN / MT5_PASSWORD / MT5_SERVER を使う。
  timeout_ms: 60000
  max_retries: 3

data:
  dir: data/raw
  timeframes: [H1, H4, D1]
  start: "2015-01-01"
  end: "2025-12-31"
  # サーバー時刻のタイムゾーン（ブローカー依存）。
  # "NY+7" = NY クローズ基準（冬 GMT+2 / 夏 GMT+3、米国の夏時間に連動）。MT5 業者で主流。
  #   サーバーの 0 時が常に NY の 17 時になり、日足は週 5 本（日曜足なし）。
  # その他: 固定オフセット "+02:00"、IANA 名 "Europe/Athens"（欧州の夏時間に連動する業者）など。
  # XM は "Europe/Athens"（2026-10 の実データで確認）。米国と欧州の夏時間がずれる週（3 月・10 月末）は
  #   NY 17 時の寄り付きがサーバーの日曜 23 時になり、1 時間分の日曜 H1/H4/D1 足ができる。
  #   日曜の H4/D1 足は検査後に月曜足へ統合する（fxbt/data/resample.py の merge_sunday_bars）。
  server_timezone: "Europe/Athens"

validation:
  min_bars:
    H1: 5000
    H4: 1500
    D1: 300
  max_intraweek_gap_hours: 4        # 週末以外でこれを超える空白は「欠損」
  # 休場・短縮取引として欠落を許容する日（許容するだけで、取引があってもエラーにはならない）。
  # 一般的な NY クローズ業者: 12/25・1/1 は休場、12/24・12/31 は早仕舞い、聖金曜日は休場または薄商い。
  allowed_gap_dates: ["12-24", "12-25", "12-31", "01-01", "good_friday"]
  max_gap_events: 20                # 欠損がこれを超えたら停止
  max_single_gap_hours: 30          # 1 回の欠落（平日分）がこれを超えたら停止
  max_abs_return: 0.05              # 1 本で 5% を超える変動は異常値として停止
  max_zero_volume_ratio: 0.01
  cross_tf_tolerance_pips: 3.0      # H4/D1 と H1 集計との許容差
  max_cross_tf_mismatch_ratio: 0.02 # 許容差を超える足の割合の上限
  expected_daily_bars_per_week: 5   # 6 なら日曜足があるブローカー（時刻設定を要確認）
  # 週の寄り付きが NY 日曜 17 時、引けが NY 金曜 17 時に一致する週の割合の下限（下回ると警告）
  min_week_session_match_ratio: 0.95

costs:
  # 想定: 一般的な MT5 業者のスタンダード口座（取引手数料なし、スプレッドに上乗せ）。
  # ECN/RAW 口座なら spread_pips を「RAW スプレッド + 往復手数料の pips 換算」にする
  #   （例: 0.2 pips + $7/lot 往復 ≒ 1.0 pips → 1.2）。
  spread_pips: 1.2           # 平時の USDJPY 平均（指標時・早朝は別途 use_bar_spread で反映）
  use_bar_spread: true       # max(固定, 足の spread 列)。ロールオーバー前後の拡大を反映する
  slippage_pips: 0.3         # エントリー・決済（成行）それぞれに不利方向へ
  triple_swap_weekday: 2     # 水曜 3 倍（0=月 ... 2=水）
  # スワップ（1 lot・1 日あたり pips、買い/売り）。日米金利差の変化に合わせた期間別の概算値。
  # 業者の取り分を差し引いた一般的な水準で、実際の値は業者ごとに異なる。
  # 取得時に data/raw/*.meta.json の symbol_info（swap_long/swap_short/swap_mode）で現在値を確認できる。
  # source: estimate = 金利差からの推定値（XM の実績ではない）。それ以外の文字列はその値の出どころ（レポートに表示）。
  swap_schedule:
    - {from: "2015-01-01", long: 0.2, short: -0.6, source: "estimate"}   # FF 0〜0.5%
    - {from: "2017-01-01", long: 0.5, short: -0.9, source: "estimate"}   # FF 0.75〜1.5%
    - {from: "2018-01-01", long: 0.9, short: -1.4, source: "estimate"}   # FF 1.5〜2.5%
    - {from: "2019-08-01", long: 0.5, short: -1.0, source: "estimate"}   # 利下げ局面
    - {from: "2020-03-16", long: -0.1, short: -0.4, source: "estimate"}  # FF 0%
    - {from: "2022-04-01", long: 0.8, short: -1.4, source: "estimate"}   # 利上げ開始
    - {from: "2022-10-01", long: 1.5, short: -2.3, source: "estimate"}   # FF 3〜4%
    - {from: "2023-03-01", long: 1.9, short: -2.8, source: "estimate"}   # FF 4.75〜5.5%
    - {from: "2024-10-01", long: 1.5, short: -2.4, source: "estimate"}   # 利下げ・日銀利上げ
    - {from: "2025-02-01", long: 0.2, short: -3.0, source: "XM の 2026-10 時点の値を当てはめ"}   # FF 4%台、日銀 0.5%。XM の現在値（2026-10 取得: +0.21 / -2.96）
  # swap_schedule が無い場合の固定値
  swap_long_pips_per_day: 1.2
  swap_short_pips_per_day: -2.1

cost_sensitivity:
  # コストだけを変えたときの成績（開発期間のウォークフォワード検証窓のみ。ホールドアウトは使わない）。
  # 値はすべて仮定・推定で、業者の実績ではない。足の spread 列は足の中の最小スプレッド（XM のティックで確認）。
  # 根拠の数値は XM のティック（2022 年の各月 1 週 1,449 本、2026-09〜10 の 792 本）と H1 足の比較による。
  reselect_params: true      # シナリオのコストでパラメーターを選び直したウォークフォワードも参考として出す
  scenarios:
    - {name: "スプレッド +0.5", spread_add_pips: 0.5,
       basis: "推定: 足の始値時点のティックスプレッドは足の記録より 2022 年で中央値 +0.3・平均 +0.7 pips、2026 年で中央値 +0.5・平均 +1.0 pips"}
    - {name: "スプレッド +1.0", spread_add_pips: 1.0,
       basis: "推定: 同じ差の上位 10% 点が 2022 年・2026 年とも +1.1 pips"}
    - {name: "足のスプレッド ×1.5", spread_mult: 1.5,
       basis: "推定: 始値時点のティックスプレッド / 足の記録 の平均が 2022 年 1.41・2026 年 1.45"}
    - {name: "スリッページ 0.5", slippage_pips: 0.5, basis: "仮定: 片道 0.3 → 0.5 pips（実約定の記録はない）"}
    - {name: "スリッページ 1.0", slippage_pips: 1.0, basis: "仮定: 片道 1.0 pips（指標発表時などの悪い約定を想定）"}
    - {name: "スワップ ×1.5", swap_mult: 1.5, basis: "仮定: 2025 年 1 月以前のスワップは推定値のため ±50% の幅を見る"}
    - {name: "スワップ ×0.5", swap_mult: 0.5, basis: "仮定: 同上"}
    - {name: "スプレッド +1.0・スリッページ 0.5", spread_add_pips: 1.0, slippage_pips: 0.5, basis: "仮定: 上の 2 つの組み合わせ"}

backtest:
  execution_tf: H1
  # 最大保有時間は暦時間（週末・休場を含む）で数える。期限が週末・休場にかかった場合は、次に取引できる足
  # （通常は月曜 0 時）の始値で決済するので、記録上の保有時間は max_hold_hours を超えることがある
  # （2016〜2022 の WF で最長 120 時間。その間の取引可能な H1 足は 69 本以下）。各戦略の max_hold_hours も同じ。
  max_hold_hours: 72         # 最大保有 3 日
  cooldown_bars: 4           # 決済後に新規エントリーを禁止する H1 本数
  same_bar_policy: stop_first  # 同一足で SL/TP 両到達時は SL 優先

periods:
  development_start: "2016-01-01"   # 指標のウォームアップに 2015 年を使う
  development_end: "2022-12-31"
  holdout_start: "2023-01-01"       # 未使用の検証期間（開発中は参照しない）
  holdout_end: "2025-12-31"

walkforward:
  train_months: 24
  test_months: 6
  step_months: 6
  min_train_trades: 30
  objective: expectancy_r    # 学習窓でのパラメーター選択基準

stats:
  bootstrap_samples: 5000
  significance_level: 0.05
  random_seed: 42

strategies:
  pullback:
    enabled: true
    params:
      d1_sma: 50
      h4_ema_fast: 20
      h4_ema_slow: 50
      adx_period: 14
      adx_min: 20
      rsi_period: 14
      rsi_long_trigger: 40     # H1 RSI がこの値を下から上抜けで押し目終了と判定（売りは 100-値 を上から下抜け）
      atr_period: 14
      sl_atr: 1.5              # H4 ATR 倍率
      tp_atr: 2.0
      max_hold_hours: 72
    filters:                   # 条件ごとの on/off（アブレーションで個別に検証）
      d1_trend: true
      h4_ema_alignment: true
      h4_adx: true
      h4_macd: false
    grid:                      # ウォークフォワードで探索する小さな格子
      rsi_long_trigger: [35, 40, 45]
      sl_atr: [1.0, 1.5, 2.0]
      tp_atr: [1.5, 2.0, 3.0]

  breakout:
    enabled: true
    params:
      range_bars_h4: 30        # 直近 N 本の確定 H4 の高値・安値をレンジとする
      max_range_atr: 6.0       # レンジ幅 / H4 ATR がこれ以下 = 収縮している
      adx_period: 14
      adx_max_before: 25       # ブレイク前の H4 ADX がこれ以下
      buffer_atr: 0.1          # 高値 + buffer*ATR を超えたらブレイク
      d1_sma: 50               # d1_trend フィルター用
      atr_period: 14
      sl_atr: 1.5
      tp_atr: 3.0
      max_hold_hours: 72
    filters:
      range_compression: true
      low_adx_before: true
      d1_trend: false
    grid:
      range_bars_h4: [20, 30, 45]
      sl_atr: [1.0, 1.5, 2.0]
      tp_atr: [2.0, 3.0, 4.0]

  mean_reversion:
    enabled: true
    params:
      h4_sma: 20
      adx_period: 14
      adx_max: 20              # H4 ADX がこれ未満ならレンジ相場
      d1_adx_max: 25
      rsi_period: 14
      rsi_oversold: 30         # H1 RSI が下から上抜けで買い（売りは 100-値 を上から下抜け）
      min_dev_atr: 1.0         # 終値と H4 SMA の乖離が H4 ATR の何倍以上か
      atr_period: 14
      sl_atr: 1.5
      tp_to_mean: true         # 利確 = シグナル時点の H4 SMA までの距離
      tp_atr: 1.5              # tp_to_mean=false のときの利確 ATR 倍率
      max_hold_hours: 48
    filters:
      h4_low_adx: true
      d1_low_adx: true
      deviation: true
    grid:
      rsi_oversold: [25, 30, 35]
      min_dev_atr: [0.5, 1.0, 1.5]
      sl_atr: [1.0, 1.5, 2.0]

output:
  dir: results
