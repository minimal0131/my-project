[project]
name = "fxbt"
version = "0.1.0"
description = "USD/JPY swing strategy research toolkit (MetaTrader 5 data, backtest only)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "PyYAML>=6.0"]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45; platform_system == 'Windows'"]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
